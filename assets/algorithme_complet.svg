<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-label="Algorithme complet : évaluer, DRP, réévaluer, arrêt si efficace, ANP si persistance avec critères cliniques, AOP selon indication"><style>.t{font-family:Segoe UI,Arial,sans-serif;fill:#12384b}.h{font-size:22px;font-weight:700}.s{font-size:15px}.b{fill:#fff;stroke:#cfe0e4;stroke-width:2}.core{fill:#0b8d99}.cw{fill:#fff}.good{fill:#eaf5ef;stroke:#cfe6d9;stroke-width:2}.warn{fill:#fff2e8;stroke:#efd2bd;stroke-width:2}.f{fill:none;stroke:#9ec7cc;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><text x="40" y="38" class="t h">Conduite à tenir face à un encombrement</text><g transform="translate(330 60)"><rect width="320" height="64" rx="16" class="b"/><text x="160" y="40" text-anchor="middle" class="t h">Évaluer la situation</text></g><path d="M490 124v30" class="f"/><g transform="translate(330 156)"><rect width="320" height="78" rx="16" class="core"/><text x="160" y="34" text-anchor="middle" class="t h cw">DRP</text><text x="160" y="58" text-anchor="middle" class="t s cw">geste de première intention</text></g><path d="M490 234v30" class="f"/><g transform="translate(330 266)"><rect width="320" height="64" rx="16" class="b"/><text x="160" y="40" text-anchor="middle" class="t h">Réévaluer</text></g><path d="M490 330v35H255v24" class="f"/><path d="M490 365h235v24" class="f"/><g transform="translate(60 390)"><rect width="390" height="92" rx="16" class="good"/><text x="28" y="34" class="t h">DRP efficace → STOP</text><text x="28" y="60" class="t s">Voies aériennes libérées : ne pas poursuivre par une aspiration.</text></g><g transform="translate(530 390)"><rect width="390" height="124" rx="16" class="warn"/><text x="28" y="34" class="t h">DRP insuffisante</text><text x="28" y="60" class="t s">Persistance + critères cliniques : envisager une ANP.</text><text x="28" y="86" class="t s">AOP : sécrétions buccales visibles, bébé intubé*</text><text x="28" y="108" class="t s">ou trouble de déglutition selon le tableau technique.</text></g><text x="40" y="545" class="t s">* Le corpus comporte « bébé intubé » et « bébé intubé et sédaté » : validation métier requise.</text></svg>