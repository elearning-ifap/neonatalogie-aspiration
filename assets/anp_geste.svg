<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-label="ANP : introduire sans aspirer, respecter le repère sans forcer, aspirer uniquement au retrait">
<defs><style>.t{font-family:'Segoe UI',Arial,sans-serif;fill:#12384b}.cap{font-size:12px;font-weight:800;letter-spacing:1.2px;fill:#0b8d99}.h{font-size:17px;font-weight:750}.s{font-size:13px;fill:#607b88}.card{fill:#fff;stroke:#d8e5e8;stroke-width:2}.n{fill:#0b8d99}.nw{font-size:14px;font-weight:800;fill:white}</style></defs>
<text x="38" y="32" class="t cap">ANP · GESTE EN TROIS TEMPS</text>
<g transform="translate(38 58)"><rect width="260" height="156" rx="18" class="card"/><circle cx="34" cy="34" r="18" class="n"/><text x="34" y="39" text-anchor="middle" font-family="Segoe UI" class="nw">01</text><text x="28" y="82" class="t h">Introduire doucement</text><text x="28" y="106" class="t s">Sans aspirer.</text><path d="M28 126 H208" stroke="#cfe1e4" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(330 58)"><rect width="260" height="156" rx="18" class="card"/><circle cx="34" cy="34" r="18" class="n"/><text x="34" y="39" text-anchor="middle" font-family="Segoe UI" class="nw">02</text><text x="28" y="82" class="t h">Respecter le repère</text><text x="28" y="106" class="t s">Ne jamais forcer.</text><path d="M28 126 H208" stroke="#cfe1e4" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(622 58)"><rect width="260" height="156" rx="18" class="card"/><circle cx="34" cy="34" r="18" fill="#e9853c"/><text x="34" y="39" text-anchor="middle" font-family="Segoe UI" class="nw">03</text><text x="28" y="82" class="t h">Aspirer au retrait</text><text x="28" y="106" class="t s">Lentement et progressivement.</text><path d="M28 126 H208" stroke="#f1d3be" stroke-width="4" stroke-linecap="round"/></g>
<rect x="38" y="235" width="844" height="42" rx="12" fill="#eef6f7"/><text x="460" y="261" text-anchor="middle" class="t s">Durée totale : 5 à 10 secondes maximum · ne pas réintroduire la sonde immédiatement.</text>
</svg>
