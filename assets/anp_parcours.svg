<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-label="ANP : mesurer, introduire sans aspirer, respecter le repère, aspirer au retrait"><style>.t{font-family:Segoe UI,Arial,sans-serif;fill:#12384b}.h{font-size:19px;font-weight:700}.s{font-size:14px}.c{fill:#fff;stroke:#d6e4e7;stroke-width:2}.n{fill:#0b8d99}</style><text x="40" y="38" class="t h">ANP · mesurer, introduire, retirer</text><g transform="translate(40 80)"><rect width="205" height="168" rx="16" class="c"/><circle cx="31" cy="31" r="18" class="n"/><text x="31" y="36" text-anchor="middle" fill="white" font-family="Segoe UI" font-weight="700">1</text><text x="22" y="80" class="t h">Mesurer</text><foreignObject x="22" y="96" width="160" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="font:14px Segoe UI,Arial;color:#607b88">Aile du nez → coin interne de l’œil</div></foreignObject></g><g transform="translate(275 80)"><rect width="205" height="168" rx="16" class="c"/><circle cx="31" cy="31" r="18" class="n"/><text x="31" y="36" text-anchor="middle" fill="white" font-family="Segoe UI" font-weight="700">2</text><text x="22" y="80" class="t h">Introduire sans aspirer</text><foreignObject x="22" y="96" width="160" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="font:14px Segoe UI,Arial;color:#607b88">Doucement, jusqu’au repère</div></foreignObject></g><g transform="translate(510 80)"><rect width="205" height="168" rx="16" class="c"/><circle cx="31" cy="31" r="18" class="n"/><text x="31" y="36" text-anchor="middle" fill="white" font-family="Segoe UI" font-weight="700">3</text><text x="22" y="80" class="t h">Ne jamais forcer</text><foreignObject x="22" y="96" width="160" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="font:14px Segoe UI,Arial;color:#607b88">Respecter le repère mesuré</div></foreignObject></g><g transform="translate(745 80)"><rect width="205" height="168" rx="16" class="c"/><circle cx="31" cy="31" r="18" class="n"/><text x="31" y="36" text-anchor="middle" fill="white" font-family="Segoe UI" font-weight="700">4</text><text x="22" y="80" class="t h">Aspirer au retrait</text><foreignObject x="22" y="96" width="160" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="font:14px Segoe UI,Arial;color:#607b88">Lentement et progressivement</div></foreignObject></g><rect x="40" y="280" width="900" height="48" rx="12" fill="#eef6f7"/><text x="490" y="310" text-anchor="middle" class="t s">Durée totale : 5 à 10 secondes maximum · ne pas réintroduire la sonde immédiatement.</text></svg>