<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-label="AOP : stimulation à l’oralité, introduire sans aspirer par l’intérieur des joues, si nécessaire aller vers l’arrière-gorge en évitant le réflexe nauséeux, aspirer au retrait">
<defs><style>.t{font-family:'Segoe UI',Arial,sans-serif;fill:#12384b}.cap{font-size:12px;font-weight:800;letter-spacing:1.2px;fill:#0b8d99}.h{font-size:16px;font-weight:750}.s{font-size:13px;fill:#607b88}.card{fill:#fff;stroke:#d8e5e8;stroke-width:2}.nw{font-size:14px;font-weight:800;fill:white}</style></defs>
<text x="38" y="32" class="t cap">AOP · REPÈRES DU GESTE</text>
<g transform="translate(38 58)"><rect width="196" height="176" rx="18" class="card"/><circle cx="32" cy="32" r="17" fill="#0b8d99"/><text x="32" y="37" text-anchor="middle" font-family="Segoe UI" class="nw">01</text><text x="24" y="82" class="t h">Stimulation</text><text x="24" y="103" class="t h">à l’oralité</text><text x="24" y="136" class="t s">Prévenir le bébé</text><text x="24" y="155" class="t s">avec la sonde.</text></g>
<g transform="translate(254 58)"><rect width="196" height="176" rx="18" class="card"/><circle cx="32" cy="32" r="17" fill="#0b8d99"/><text x="32" y="37" text-anchor="middle" font-family="Segoe UI" class="nw">02</text><text x="24" y="82" class="t h">Introduire</text><text x="24" y="103" class="t h">sans aspirer</text><text x="24" y="136" class="t s">Commencer par</text><text x="24" y="155" class="t s">l’intérieur des joues.</text></g>
<g transform="translate(470 58)"><rect width="196" height="176" rx="18" class="card"/><circle cx="32" cy="32" r="17" fill="#0b8d99"/><text x="32" y="37" text-anchor="middle" font-family="Segoe UI" class="nw">03</text><text x="24" y="82" class="t h">Si nécessaire</text><text x="24" y="103" class="t h">arrière-gorge</text><text x="24" y="136" class="t s">Éviter le réflexe</text><text x="24" y="155" class="t s">nauséeux.</text></g>
<g transform="translate(686 58)"><rect width="196" height="176" rx="18" class="card"/><circle cx="32" cy="32" r="17" fill="#e9853c"/><text x="32" y="37" text-anchor="middle" font-family="Segoe UI" class="nw">04</text><text x="24" y="82" class="t h">Aspirer</text><text x="24" y="103" class="t h">au retrait</text><text x="24" y="136" class="t s">Lentement et</text><text x="24" y="155" class="t s">progressivement.</text></g>
<rect x="38" y="250" width="844" height="42" rx="12" fill="#eef6f7"/><text x="460" y="276" text-anchor="middle" class="t s">Durée totale : 5 à 10 secondes maximum · ne pas réintroduire la sonde immédiatement.</text>
</svg>
