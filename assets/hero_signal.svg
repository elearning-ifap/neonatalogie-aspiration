<g transform="translate(408 96)"><circle cx="32" cy="36" r="31" class="accent"/><text x="32" y="42" text-anchor="middle" class="t n">03</text><text x="0" y="102" class="t h">Réévaluer</text><text x="0" y="127" class="t s">Effet obtenu ?</text></g>
