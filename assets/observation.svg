<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-label="Quatre éléments à observer : bruits respiratoires, dynamique respiratoire, SpO2 et tolérance">
<defs><style>.t{font-family:'Segoe UI',Arial,sans-serif;fill:#12384b}.h{font-size:20px;font-weight:750}.s{font-size:14px;fill:#607c89}.card{fill:#fff;stroke:#d7e4e7;stroke-width:2}.ic{fill:none;stroke:#0b8d99;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.num{font-size:12px;font-weight:800;fill:#0b8d99;letter-spacing:1px}</style></defs>
<text x="42" y="36" class="t num">AVANT D’AGIR · ÉVALUER LA SITUATION</text>
<g transform="translate(42 72)"><rect width="394" height="120" rx="18" class="card"/><path d="M45 39 C65 24 78 24 97 39 M45 57 C65 42 78 42 97 57 M45 75 C65 60 78 60 97 75" class="ic"/><text x="128" y="52" class="t h">Bruits respiratoires</text><text x="128" y="79" class="t s">Écouter ce qui oriente le raisonnement.</text></g>
