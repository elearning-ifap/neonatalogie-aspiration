<g transform="translate(42 220)"><rect width="394" height="120" rx="18" class="card"/><rect x="40" y="30" width="62" height="55" rx="10" class="ic"/><text x="71" y="65" text-anchor="middle" class="t h" style="font-size:18px">SpO₂</text><text x="128" y="52" class="t h">Saturation pulsée</text><text x="128" y="79" class="t s">Lire la valeur dans son contexte clinique.</text></g>
<g transform="translate(484 220)"><rect width="394" height="120" rx="18" class="card"/><path d="M72 28 C55 28 42 41 42 58 C42 80 72 91 72 91 C72 91 102 80 102 58 C102 41 89 28 72 28Z" class="ic"/><path d="M58 58 h8 l5-10 7 20 5-10 h8" class="ic"/><text x="128" y="52" class="t h">Tolérance</text><text x="128" y="79" class="t s">Apprécier la réponse globale du nouveau-né.</text></g>
